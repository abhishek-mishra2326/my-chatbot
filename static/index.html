<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saathi | Tumhara AI chatbot</title>
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar">
      <button id="newChat" class="new-chat" type="button">+ Nayi chat</button>
      <nav id="convList" class="conv-list" aria-label="Purani chats"></nav>
      <div class="account">
        <span id="userEmail" class="user-email"></span>
        <button id="logoutBtn" class="link" type="button">Logout</button>
      </div>
    </aside>
    <div id="backdrop" class="backdrop"></div>

    <div class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn" type="button" aria-label="Chats ki list kholo">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="brand">
          <span class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2c.6 5.2 4.8 9.4 10 10-5.2.6-9.4 4.8-10 10-.6-5.2-4.8-9.4-10-10C7.200 11.400 11.400 7.200 12 2z"/></svg>
          </span>
          <span class="brand-name">Saathi</span>
        </div>
        <button id="themeBtn" class="icon-btn" type="button" aria-label="Theme badlo">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.800A9 9 0 1 1 11.200 3a7 7 0 0 0 9.800 9.800z"/></svg>
        </button>
      </header>

      <main id="chat" class="chat">
        <div class="wrap">
          <section id="welcome" class="welcome">
            <h1 id="greeting">Kya seekhna hai aaj?</h1>
            <p>Code, ML, padhai ya koi bhi doubt. Seedha poochho.</p>
            <div class="chips">
              <button class="chip" type="button">Python mein list aur tuple ka fark samjhao</button>
              <button class="chip" type="button">Machine learning ka beginner roadmap batao</button>
              <button class="chip" type="button">Mere exam ke liye 7 din ka study plan banao</button>
              <button class="chip" type="button">Overfitting kya hota hai, simple example se</button>
            </div>
          </section>
          <div id="messages" class="messages" aria-live="polite"></div>
        </div>
      </main>

      <footer class="dock">
        <div class="wrap">
          <form id="composer" class="composer">
            <textarea id="input" rows="1" maxlength="2000" placeholder="Kuch poochho..." aria-label="Apna message likho"></textarea>
            <span id="count" class="count" hidden></span>
            <button id="send" class="send" type="submit" aria-label="Message bhejo">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </form>
          <p class="hint">Enter se bhejo, Shift + Enter se nayi line. AI galti kar sakta hai, zaroori baatein verify karo.</p>
        </div>
      </footer>
    </div>
  </div>

  <div id="auth" class="auth" hidden>
    <form id="authForm" class="auth-card">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2c.6 5.2 4.8 9.4 10 10-5.2.6-9.4 4.8-10 10-.6-5.2-4.8-9.4-10-10C7.200 11.400 11.400 7.200 12 2z"/></svg>
      </span>
      <h2 id="authTitle">Wapas aao</h2>
      <p id="authSub">Login karke apni purani chats dekho.</p>
      <label>Email
        <input id="email" type="email" autocomplete="email" required>
      </label>
      <label>Password
        <input id="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required>
      </label>
      <p id="authError" class="auth-error" role="alert" hidden></p>
      <button id="authSubmit" class="primary" type="submit">Login</button>
      <button id="authToggle" class="link" type="button">Naya account banao</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
