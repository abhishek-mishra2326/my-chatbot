<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saathi | Your AI chatbot</title>
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2c.6 5.2 4.8 9.4 10 10-5.2.6-9.4 4.8-10 10-.6-5.2-4.8-9.4-10-10C7.200 11.400 11.400 7.200 12 2z"/></svg>
      </span>
      <span class="brand-name">Saathi</span>
    </div>
    <div class="actions">
      <button id="newChat" class="btn-ghost" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New Chat
      </button>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="Theme badlo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.800A9 9 0 1 1 11.200 3a7 7 0 0 0 9.800 9.800z"/></svg>
      </button>
    </div>
  </header>

  <main id="chat" class="chat">
    <div class="wrap">
      <section id="welcome" class="welcome">
        <h1 id="greeting">Kya seekhna hai aaj?</h1>
        <p>Code, ML, padhai ya koi bhi doubt, Seedha poochho.</p>
        <div class="chips">
          <button class="chip" type="button">Python mein list aur tuple ka fark samjhao</button>
          <button class="chip" type="button">Machine learning ka beginner roadmap batao</button>
          <button class="chip" type="button">Mere exam ke liye 7 din ka study plan banao</button>
          <button class="chip" type="button">Overfitting kya hota hai, simple example se</button>
        </div>
      </section>
      <div id="messages" class="messages" aria-live="polite"></div>
    </div>
  </main>

  <footer class="dock">
    <div class="wrap">
      <form id="composer" class="composer">
        <textarea id="input" rows="1" maxlength="2000" placeholder="Ask anything..." aria-label="Enter your message"></textarea>
        <span id="count" class="count" hidden></span>
        <button id="send" class="send" type="submit" aria-label="Send Message">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
      <p class="hint">Press Enter key to send, Press Shift + Enter key to jump new line. AI galti kar sakta hai, zaroori baatein verify karo.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
